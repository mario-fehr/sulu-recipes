name: QA

on:
    pull_request:
        branches:
            - main
    schedule:
        -
            cron: '30 6 * * 1'
    workflow_dispatch:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false
            line:
                type: string
                required: false
    workflow_call:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false
            line:
                type: string
                required: false

permissions:
    contents: read

concurrency:
    group: qa-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    RECIPES_REPOSITORY: ${{ inputs.recipes-repository || github.repository }}
    RECIPES_REF: ${{ inputs.recipes-ref || github.sha }}
    SKELETON_REPOSITORY: ${{ inputs.skeleton-repository || format('{0}/sulu-flex-skeleton', github.repository_owner) }}

defaults:
    run:
        shell: bash

jobs:
    lint:
        name: lint
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    tools: 'composer:v2'
                    coverage: none
            -
                run: shellcheck -x -P tests tests/build-endpoint.sh tests/install.sh tests/install-bare.sh tests/parity.sh tests/setup-tools.sh tests/drift.sh tests/style.sh bin/supersede.sh
            -
                run: tests/style.sh
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                run: tests/setup-tools.sh
            -
                run: tests/build-endpoint.sh

    lines:
        name: lines
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            lines: ${{ steps.lines.outputs.lines }}
            bare: ${{ steps.lines.outputs.bare }}
        steps:
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                id: lines
                env:
                    LINE: ${{ inputs.line }}
                run: |
                    if [ -n "$LINE" ]; then
                        if [ ! -f "tests/lines/$LINE.env" ]; then
                            echo "no pin file tests/lines/$LINE.env for line $LINE" >&2
                            exit 1
                        fi
                        lines=$(jq -cn --arg l "$LINE" '[$l]')
                    else
                        lines=$(find tests/lines -maxdepth 1 -name '*.env' | sort | jq -R -s -c 'split("\n") | map(select(. != "") | sub("^.*/"; "") | rtrimstr(".env"))')
                    fi
                    echo "lines=$lines" >> "$GITHUB_OUTPUT"
                    bare=$(for l in $(jq -r '.[]' <<<"$lines"); do
                        # shellcheck source=/dev/null
                        ( . "tests/lines/$l.env"; for s in ${SULU_BARE_SYMFONY_VERSIONS:-}; do jq -cn --arg line "$l" --arg symfony "$s" '{line: $line, symfony: $symfony}'; done )
                    done | jq -s -c .)
                    echo "bare=$bare" >> "$GITHUB_OUTPUT"

    install:
        name: install (${{ matrix.line }})
        needs: [lint, lines]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                line: ${{ fromJSON(needs.lines.outputs.lines) }}
        env:
            SULU_LINE: ${{ matrix.line }}
        steps:
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/install.sh
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: install-logs-${{ matrix.line }}
                    path: ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                    retention-days: 7

    install-bare:
        name: install-bare (${{ matrix.line }}, ${{ matrix.symfony }})
        needs: [lint, lines]
        # Not when flex-update.yml calls this workflow on push: an upstream release would block publishing without protecting anyone.
        if: needs.lines.outputs.bare != '[]' && github.event_name != 'push'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.lines.outputs.bare) }}
        env:
            SULU_LINE: ${{ matrix.line }}
            SULU_BARE_SYMFONY: ${{ matrix.symfony }}
        steps:
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.symfony }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.symfony }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/install-bare.sh
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: install-bare-logs-${{ matrix.line }}-${{ matrix.symfony }}
                    path: ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                    retention-days: 7

    parity:
        name: parity (${{ matrix.line }})
        needs: [lint, lines]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                line: ${{ fromJSON(needs.lines.outputs.lines) }}
        env:
            SULU_LINE: ${{ matrix.line }}
        steps:
            -
                run: |
                    echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
                    echo "SKELETON_DIR=$GITHUB_WORKSPACE/.ci/sulu-flex-skeleton" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                env:
                    INPUT_SKELETON_REF: ${{ inputs.skeleton-ref }}
                run: |
                    grep . "tests/lines/$SULU_LINE.env" >> "$GITHUB_ENV"
                    # shellcheck source=/dev/null
                    . "tests/lines/$SULU_LINE.env"
                    echo "SKELETON_REF=${INPUT_SKELETON_REF:-$SULU_FLEX_SKELETON_REF}" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.SKELETON_REPOSITORY }}
                    ref: ${{ env.SKELETON_REF }}
                    path: .ci/sulu-flex-skeleton
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/parity.sh
                env:
                    COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: parity-logs-${{ matrix.line }}
                    path: |
                        ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-report.txt
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-diffs/
                    retention-days: 7
