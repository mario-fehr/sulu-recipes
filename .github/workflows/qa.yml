name: QA

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false
    workflow_call:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false

permissions:
    contents: read

concurrency:
    group: qa-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    RECIPES_REPOSITORY: ${{ inputs.recipes-repository || github.repository }}
    RECIPES_REF: ${{ inputs.recipes-ref || github.sha }}
    SKELETON_REPOSITORY: ${{ inputs.skeleton-repository || format('{0}/sulu-flex-skeleton', github.repository_owner) }}
    SKELETON_REF: ${{ inputs.skeleton-ref || '3.0' }}
    SULU_SKELETON_SHA: 336f7ba88a2a4b10d63ec942981c38f9c2a94f04

defaults:
    run:
        shell: bash

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    tools: 'composer:v2'
                    coverage: none
            -
                run: shellcheck -x -P tests tests/build-endpoint.sh tests/install.sh tests/parity.sh tests/setup-tools.sh bin/supersede.sh
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                run: tests/setup-tools.sh
            -
                run: tests/build-endpoint.sh

    install:
        name: install
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: actions/checkout@v7
                with:
                    repository: sulu/skeleton
                    ref: ${{ env.SULU_SKELETON_SHA }}
                    path: .references/sulu-skeleton
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/install.sh
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: install-logs
                    path: ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                    retention-days: 7

    parity:
        name: parity
        needs: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -
                run: |
                    echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
                    echo "SKELETON_DIR=$GITHUB_WORKSPACE/.references/sulu-flex-skeleton" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: actions/checkout@v7
                with:
                    repository: sulu/skeleton
                    ref: ${{ env.SULU_SKELETON_SHA }}
                    path: .references/sulu-skeleton
                    persist-credentials: false
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.SKELETON_REPOSITORY }}
                    ref: ${{ env.SKELETON_REF }}
                    path: .references/sulu-flex-skeleton
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/parity.sh
                env:
                    COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: parity-logs
                    path: |
                        ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-report.txt
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-diffs/
                    retention-days: 7
