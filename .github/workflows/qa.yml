name: QA

on:
    pull_request:
        branches:
            - main
    schedule:
        -
            cron: '30 6 * * 1'
    workflow_dispatch:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false
            line:
                type: string
                required: false
    workflow_call:
        inputs:
            recipes-repository:
                type: string
                required: false
            recipes-ref:
                type: string
                required: false
            skeleton-repository:
                type: string
                required: false
            skeleton-ref:
                type: string
                required: false
            line:
                type: string
                required: false

permissions:
    contents: read

concurrency:
    group: qa-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    RECIPES_REPOSITORY: ${{ inputs.recipes-repository || github.repository }}
    RECIPES_REF: ${{ inputs.recipes-ref || github.sha }}
    SKELETON_REPOSITORY: ${{ inputs.skeleton-repository || format('{0}/sulu-flex-skeleton', github.repository_owner) }}

defaults:
    run:
        shell: bash

jobs:
    lint:
        name: lint
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    tools: 'composer:v2'
                    coverage: none
            -
                run: shellcheck -x -P tests tests/build-endpoint.sh tests/install.sh tests/install-bare.sh tests/parity.sh tests/setup-tools.sh tests/drift.sh tests/style.sh tests/matrix.sh tests/patches.sh bin/supersede.sh bin/make-patch.sh bin/sync-skeleton.sh tests/docs.sh
            -
                run: tests/style.sh
            -
                run: tests/docs.sh
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                run: tests/setup-tools.sh
            -
                run: tests/build-endpoint.sh
            -
                run: tests/patches.sh

    lines:
        name: lines
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            lines: ${{ steps.lines.outputs.lines }}
            install: ${{ steps.lines.outputs.install }}
            install_push: ${{ steps.lines.outputs.install_push }}
            bare: ${{ steps.lines.outputs.bare }}
        steps:
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                id: lines
                env:
                    LINE: ${{ inputs.line }}
                run: tests/matrix.sh "$LINE" >> "$GITHUB_OUTPUT"

    install:
        name: install (${{ matrix.line }}, PHP ${{ matrix.php }}, MySQL ${{ matrix.mysql }})
        needs: [lint, lines]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(github.event_name == 'push' && needs.lines.outputs.install_push || needs.lines.outputs.install) }}
        env:
            SULU_LINE: ${{ matrix.line }}
            SULU_PHP: ${{ matrix.php }}
            SULU_MYSQL_VERSION: ${{ matrix.mysql }}
        steps:
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.php }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.php }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/install.sh
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: install-logs-${{ matrix.line }}-${{ matrix.php }}
                    path: ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                    retention-days: 7

    install-bare:
        name: install-bare (${{ matrix.line }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.deps }})
        needs: [lint, lines]
        # Not when flex-update.yml calls this workflow on push: an upstream release would block publishing without protecting anyone.
        if: needs.lines.outputs.bare != '[]' && github.event_name != 'push'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.lines.outputs.bare) }}
        env:
            SULU_LINE: ${{ matrix.line }}
            SULU_PHP: ${{ matrix.php }}
            SULU_MYSQL_VERSION: ${{ matrix.mysql }}
            SULU_BARE_SYMFONY: ${{ matrix.symfony }}
            SULU_BARE_DEPS: ${{ matrix.deps }}
            SULU_BARE_LOCK: ${{ matrix.lock }}
        steps:
            -
                run: echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.deps }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.deps }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/install-bare.sh
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: install-bare-logs-${{ matrix.line }}-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.deps }}
                    path: ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                    retention-days: 7

    parity:
        name: parity (${{ matrix.line }})
        needs: [lint, lines]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                line: ${{ fromJSON(needs.lines.outputs.lines) }}
        env:
            SULU_LINE: ${{ matrix.line }}
        steps:
            -
                run: |
                    echo "SULU_RECIPES_WORKDIR=$RUNNER_TEMP/sulu-recipes" >> "$GITHUB_ENV"
                    echo "SKELETON_DIR=$GITHUB_WORKSPACE/.ci/sulu-flex-skeleton" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.RECIPES_REPOSITORY }}
                    ref: ${{ env.RECIPES_REF }}
                    persist-credentials: false
            -
                env:
                    INPUT_SKELETON_REF: ${{ inputs.skeleton-ref }}
                run: |
                    grep . "tests/lines/$SULU_LINE.env" >> "$GITHUB_ENV"
                    # shellcheck source=/dev/null
                    . "tests/lines/$SULU_LINE.env"
                    echo "SKELETON_REF=${INPUT_SKELETON_REF:-$SULU_FLEX_SKELETON_REF}" >> "$GITHUB_ENV"
            -
                uses: actions/checkout@v7
                with:
                    repository: ${{ env.SKELETON_REPOSITORY }}
                    ref: ${{ env.SKELETON_REF }}
                    path: .ci/sulu-flex-skeleton
                    persist-credentials: false
            -
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: 'ctype, iconv, mysql, gd'
                    tools: 'composer:v2'
                    coverage: none
            -
                id: composer-cache
                run: echo "dir=$(composer config --global cache-dir)" >> "$GITHUB_OUTPUT"
            -
                uses: actions/cache@v6
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-${{ github.run_id }}
                    restore-keys: composer-${{ runner.os }}-${{ github.job }}-${{ matrix.line }}-
            -
                run: tests/setup-tools.sh
            -
                run: tests/parity.sh
                env:
                    COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
            -
                if: failure() || cancelled()
                uses: actions/upload-artifact@v7
                with:
                    name: parity-logs-${{ matrix.line }}
                    path: |
                        ${{ env.SULU_RECIPES_WORKDIR }}/*.log
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-report.txt
                        ${{ env.SULU_RECIPES_WORKDIR }}/parity-diffs/
                    retention-days: 7
